## AI-Assisted

## Per-repo parameters for developer-meta-files consumer workflows, read at
## workflow runtime. Here: apt packages + the helper-scripts runtime the
## genmkfile dist-ai suite needs (make-helper sources helper-scripts and shells
## out to dpkg-dev / debhelper build tooling).
##
## moreutils supplies 'sponge', which 'make_debinstfile_create' requires by name
## ('make_require safe-rm sponge'). Without it the debinstfile target dies before
## generating anything, so the routing test fails for a missing tool rather than a
## real defect.
##
## rsync and dctrl-tools are what 'install' and the binary-stanza walk shell out to;
## declared here rather than relied on as incidentally present in the runner image.
##
## bc computes the changelog revision bump in 'make_deb_chl_bumpup'
## ('make_require debchange bc'); the chl_bumpup_revision suite drives that real
## code and FATALs without it (debchange itself is stubbed in the test).
dist-ai-tests:
  ## strip-nondeterminism normalizes the .orig tarball in make_dist
  ## ('make_require strip-nondeterminism'); the dist_debian_sibling suite drives it.
  apt-packages: "python3 safe-rm dpkg-dev debhelper moreutils rsync dctrl-tools bc strip-nondeterminism"
  helper-scripts: true
